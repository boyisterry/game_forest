<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>石头磨碎与重组 Demo</title>
  <style>
    :root {
      --ink: #201e1a;
      --muted: #746e64;
      --panel: rgba(248, 246, 239, 0.92);
      --stone: #554f46;
      --stone-soft: #dfdbd0;
      --rust: #9b5c32;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9e9c91;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed;
      z-index: 3;
      top: 18px;
      left: 20px;
      width: min(440px, calc(100vw - 40px));
      padding: 18px;
      border: 1px solid rgba(42, 38, 32, 0.13);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(35, 31, 26, 0.25);
      backdrop-filter: blur(12px);
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--rust);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }
    h1 { margin: 0 0 7px; font-size: 20px; }
    .description {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 9px 16px;
      background: var(--stone);
      color: #fffdf7;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: var(--stone-soft); color: var(--ink); }
    button.ghost {
      background: transparent;
      color: var(--stone);
      box-shadow: inset 0 0 0 1px #bdb7aa;
    }
    button:disabled { cursor: default; opacity: 0.4; }
    .meter {
      height: 4px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 99px;
      background: #ddd9cf;
    }
    .meter i {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--stone), var(--rust));
    }
    .state {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .state strong { color: var(--rust); }
    .legend {
      position: fixed;
      z-index: 3;
      right: 18px;
      bottom: 16px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(35, 33, 29, 0.62);
      color: rgba(255, 252, 244, 0.9);
      font-size: 11px;
      backdrop-filter: blur(8px);
    }
    @media (max-width: 640px) {
      .hud { top: 12px; left: 12px; width: calc(100vw - 24px); padding: 15px; }
      .description { display: none; }
    }
  </style>
</head>
<body>
  <section class="hud" aria-label="石头磨碎特效控制">
    <p class="eyebrow">STONE GRIND / FX STUDY</p>
    <h1>完整岩石 ↔ 悬浮碎石</h1>
    <p class="description">
      岩石受压崩裂后，不同大小的真实几何碎块会从原石轮廓向四周分团悬浮。
      石材使用程序化颜色、法线与粗糙度贴图，并可从悬浮碎片反向重组。
    </p>
    <div class="row">
      <button id="grind" type="button">磨碎石头</button>
      <button id="restore" class="secondary" type="button" disabled>重组石头</button>
      <button id="cycle" class="ghost" type="button">自动往返</button>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <div class="state">
      <span id="state">状态：<strong>完整岩石</strong></span>
      <span id="count"></span>
    </div>
  </section>
  <div class="legend">拖拽旋转 · 滚轮缩放 · R 重组 · Space 磨碎 · 兔子 1.70 m 比例参考</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { buildRabbitScaleReference } from "./rabbit-scale-reference.js";

    const FRAGMENT_COUNT = 92;
    const DUST_COUNT = 360;
    const GRIND_DURATION = 1.45;
    const RESTORE_DURATION = 1.75;
    const clamp01 = (value) => Math.min(1, Math.max(0, value));
    const smoothstep = (value) => {
      const t = clamp01(value);
      return t * t * (3 - 2 * t);
    };
    const easeOutCubic = (value) => 1 - Math.pow(1 - clamp01(value), 3);
    const easeInOutCubic = (value) =>
      value < 0.5 ? 4 * value * value * value : 1 - Math.pow(-2 * value + 2, 3) / 2;

    let randomState = 0x51f15e;
    function random() {
      randomState = (Math.imul(randomState, 1664525) + 1013904223) >>> 0;
      return randomState / 4294967296;
    }
    const range = (min, max) => min + (max - min) * random();

    function makeStoneTextures(size = 256) {
      const height = new Float32Array(size * size);
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const nx = x / size;
          const ny = y / size;
          const broad =
            Math.sin(nx * Math.PI * 7.2 + Math.sin(ny * 11)) * 0.22 +
            Math.cos(ny * Math.PI * 9.4 - nx * 8) * 0.18;
          const grain = (random() - 0.5) * 0.34;
          const pit = random() > 0.985 ? -0.75 : 0;
          height[y * size + x] = broad + grain + pit;
        }
      }

      const colorCanvas = document.createElement("canvas");
      const normalCanvas = document.createElement("canvas");
      const roughCanvas = document.createElement("canvas");
      colorCanvas.width = normalCanvas.width = roughCanvas.width = size;
      colorCanvas.height = normalCanvas.height = roughCanvas.height = size;
      const colorCtx = colorCanvas.getContext("2d");
      const normalCtx = normalCanvas.getContext("2d");
      const roughCtx = roughCanvas.getContext("2d");
      const colorImage = colorCtx.createImageData(size, size);
      const normalImage = normalCtx.createImageData(size, size);
      const roughImage = roughCtx.createImageData(size, size);
      const at = (x, y) => height[((y + size) % size) * size + ((x + size) % size)];

      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const index = (y * size + x) * 4;
          const h = at(x, y);
          const mineral = Math.sin(x * 0.37 + y * 0.19) * 7;
          colorImage.data[index] = 112 + h * 22 + mineral;
          colorImage.data[index + 1] = 107 + h * 19 + mineral * 0.65;
          colorImage.data[index + 2] = 96 + h * 16;
          colorImage.data[index + 3] = 255;

          const dx = (at(x + 1, y) - at(x - 1, y)) * 1.8;
          const dy = (at(x, y + 1) - at(x, y - 1)) * 1.8;
          const normal = new THREE.Vector3(-dx, -dy, 1).normalize();
          normalImage.data[index] = (normal.x * 0.5 + 0.5) * 255;
          normalImage.data[index + 1] = (normal.y * 0.5 + 0.5) * 255;
          normalImage.data[index + 2] = normal.z * 255;
          normalImage.data[index + 3] = 255;

          const rough = THREE.MathUtils.clamp(222 - h * 18 + Math.abs(mineral), 185, 246);
          roughImage.data[index] = roughImage.data[index + 1] = roughImage.data[index + 2] = rough;
          roughImage.data[index + 3] = 255;
        }
      }
      colorCtx.putImageData(colorImage, 0, 0);
      normalCtx.putImageData(normalImage, 0, 0);
      roughCtx.putImageData(roughImage, 0, 0);

      const configure = (canvas, colorSpace = THREE.NoColorSpace) => {
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2.5, 2.5);
        texture.anisotropy = 8;
        texture.colorSpace = colorSpace;
        return texture;
      };
      return {
        map: configure(colorCanvas, THREE.SRGBColorSpace),
        normalMap: configure(normalCanvas),
        roughnessMap: configure(roughCanvas),
      };
    }

    function distortGeometry(geometry, strength, seedOffset) {
      const position = geometry.getAttribute("position");
      const point = new THREE.Vector3();
      for (let i = 0; i < position.count; i += 1) {
        point.fromBufferAttribute(position, i);
        const noise =
          Math.sin(point.x * 3.1 + seedOffset) * 0.45 +
          Math.sin(point.y * 4.7 - seedOffset * 0.7) * 0.3 +
          Math.cos(point.z * 3.9 + seedOffset * 1.3) * 0.25;
        point.multiplyScalar(1 + noise * strength);
        position.setXYZ(i, point.x, point.y, point.z);
      }
      position.needsUpdate = true;
      geometry.computeVertexNormals();
      return geometry;
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.06;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa8a79d);
    scene.fog = new THREE.Fog(0xa8a79d, 34, 80);

    const camera = new THREE.PerspectiveCamera(39, innerWidth / innerHeight, 0.1, 120);
    camera.position.set(14, 9, 18);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.1, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 8;
    controls.maxDistance = 42;

    scene.add(new THREE.HemisphereLight(0xf4f0e4, 0x3d3b38, 1.7));
    const sun = new THREE.DirectionalLight(0xffe4ba, 3.2);
    sun.position.set(-13, 24, 16);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -18;
    sun.shadow.camera.right = 18;
    sun.shadow.camera.top = 18;
    sun.shadow.camera.bottom = -12;
    scene.add(sun);
    const rim = new THREE.DirectionalLight(0xaebac3, 0.8);
    rim.position.set(15, 8, -16);
    scene.add(rim);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(30, 80),
      new THREE.MeshStandardMaterial({ color: 0x77756a, roughness: 1 }),
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);
    const rabbitReference = buildRabbitScaleReference();
    rabbitReference.position.set(4.2, 0, 2.8);
    rabbitReference.rotation.y = -0.4;
    scene.add(rabbitReference);

    const textures = makeStoneTextures();
    const stoneMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: textures.map,
      normalMap: textures.normalMap,
      normalScale: new THREE.Vector2(0.48, 0.48),
      roughnessMap: textures.roughnessMap,
      roughness: 0.92,
      metalness: 0.02,
    });
    const fragmentMaterial = stoneMaterial.clone();
    fragmentMaterial.normalScale.set(0.64, 0.64);

    const intactGeometry = distortGeometry(new THREE.DodecahedronGeometry(3.7, 2), 0.13, 4.2);
    intactGeometry.scale(1.18, 0.86, 1);
    const intact = new THREE.Mesh(intactGeometry, stoneMaterial);
    intact.position.y = 3.05;
    intact.rotation.set(-0.08, 0.32, 0.04);
    intact.castShadow = true;
    intact.receiveShadow = true;
    scene.add(intact);

    const fragmentVariants = [
      new THREE.TetrahedronGeometry(1, 0),
      new THREE.OctahedronGeometry(1, 0),
      distortGeometry(new THREE.TetrahedronGeometry(1, 0), 0.18, 9.3),
      distortGeometry(new THREE.IcosahedronGeometry(1, 0), 0.1, 11.7),
    ];
    const fragmentRoot = new THREE.Group();
    fragmentRoot.visible = false;
    scene.add(fragmentRoot);
    const stoneCenter = new THREE.Vector3(0, 3.05, 0);
    const floatClusters = [
      new THREE.Vector3(-1, 0.22, -0.35),
      new THREE.Vector3(-0.72, 0.68, 0.5),
      new THREE.Vector3(-0.3, -0.7, 0.85),
      new THREE.Vector3(0.28, 0.82, -0.72),
      new THREE.Vector3(0.62, -0.55, -0.62),
      new THREE.Vector3(0.82, 0.35, 0.42),
      new THREE.Vector3(0.15, -0.82, 0.28),
      new THREE.Vector3(-0.5, 0.08, -0.86),
    ].map((direction) => direction.normalize());
    const fragments = [];
    const temp = new THREE.Vector3();
    const startEuler = new THREE.Euler();
    const endEuler = new THREE.Euler();
    let fragmentTriangles = 0;

    for (let i = 0; i < FRAGMENT_COUNT; i += 1) {
      const geometry = fragmentVariants[i % fragmentVariants.length];
      const mesh = new THREE.Mesh(geometry, fragmentMaterial);
      let x;
      let y;
      let z;
      do {
        x = range(-3.2, 3.2);
        y = range(0.45, 5.65);
        z = range(-2.6, 2.6);
      } while ((x / 3.2) ** 2 + ((y - 3.05) / 2.7) ** 2 + (z / 2.6) ** 2 > 1);
      const start = new THREE.Vector3(x, y, z);
      const size = range(0.2, 0.58) * (i < 14 ? range(1.25, 1.7) : 1);
      const cluster = floatClusters[i % floatClusters.length];
      const radial = start.clone().sub(stoneCenter).multiplyScalar(range(1.22, 1.52));
      const clusterDrift = cluster.clone().multiplyScalar(range(1.4, 2.8));
      const end = stoneCenter.clone()
        .add(radial)
        .add(clusterDrift)
        .add(new THREE.Vector3(range(-0.38, 0.38), range(-0.32, 0.32), range(-0.38, 0.38)));
      end.y = Math.max(1.05 + size, end.y);
      startEuler.set(range(-1, 1), range(0, Math.PI * 2), range(-1, 1));
      endEuler.set(range(-1.5, 1.5), range(0, Math.PI * 2), range(-1.5, 1.5));
      const startQuat = new THREE.Quaternion().setFromEuler(startEuler);
      const endQuat = new THREE.Quaternion().setFromEuler(endEuler);
      mesh.position.copy(start);
      mesh.quaternion.copy(startQuat);
      mesh.scale.setScalar(0.001);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.frustumCulled = false;
      fragmentRoot.add(mesh);
      fragments.push({
        mesh,
        start,
        end,
        startQuat,
        endQuat,
        size,
        delay: (i % 13) * 0.008,
      });
      const index = geometry.getIndex();
      fragmentTriangles += index ? index.count / 3 : geometry.getAttribute("position").count / 3;
    }

    const dustPositions = new Float32Array(DUST_COUNT * 3);
    const dustSeeds = [];
    for (let i = 0; i < DUST_COUNT; i += 1) {
      const angle = random() * Math.PI * 2;
      dustSeeds.push({
        angle,
        radius: range(0.3, 8.5),
        height: range(0.08, 2.4),
        speed: range(0.7, 1.4),
      });
    }
    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute("position", new THREE.BufferAttribute(dustPositions, 3));
    const dustMaterial = new THREE.PointsMaterial({
      color: 0xb9aa8f,
      size: 0.12,
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.NormalBlending,
    });
    const dust = new THREE.Points(dustGeometry, dustMaterial);
    scene.add(dust);

    const impactRing = new THREE.Mesh(
      new THREE.RingGeometry(1, 1.08, 80),
      new THREE.MeshBasicMaterial({
        color: 0xc5b494,
        transparent: true,
        opacity: 0,
        side: THREE.DoubleSide,
        depthWrite: false,
      }),
    );
    impactRing.rotation.x = -Math.PI / 2;
    impactRing.position.y = 0.035;
    scene.add(impactRing);

    const grindBtn = document.getElementById("grind");
    const restoreBtn = document.getElementById("restore");
    const cycleBtn = document.getElementById("cycle");
    const stateEl = document.getElementById("state");
    const countEl = document.getElementById("count");
    const meterEl = document.getElementById("meter");
    countEl.textContent = `${FRAGMENT_COUNT} 块碎石 · ${Math.round(fragmentTriangles).toLocaleString()} 面`;

    let amount = 0;
    let fromAmount = 0;
    let targetAmount = 0;
    let elapsed = 0;
    let duration = GRIND_DURATION;
    let busy = false;
    let autoCycle = false;
    let autoPause = 0;

    function updateHud() {
      const label = busy
        ? targetAmount > fromAmount ? "磨碎中" : "重组中"
        : amount > 0.999 ? "悬浮碎石" : "完整岩石";
      stateEl.innerHTML = `状态：<strong>${label}</strong>`;
      meterEl.style.width = `${Math.round(amount * 100)}%`;
      grindBtn.disabled = busy || targetAmount === 1;
      restoreBtn.disabled = busy || targetAmount === 0;
      cycleBtn.textContent = autoCycle ? "停止往返" : "自动往返";
    }

    function applyPose() {
      const intactFade = 1 - smoothstep(amount / 0.2);
      intact.visible = intactFade > 0.002;
      intact.scale.set(1 + amount * 0.07, 1 - amount * 0.13, 1 + amount * 0.07);
      stoneMaterial.transparent = true;
      stoneMaterial.opacity = intactFade;
      stoneMaterial.depthWrite = intactFade > 0.5;

      const reveal = smoothstep((amount - 0.045) / 0.2);
      fragmentRoot.visible = reveal > 0.002;
      for (const fragment of fragments) {
        const local = smoothstep((amount + fragment.delay - 0.05) / 0.86);
        fragment.mesh.position.lerpVectors(fragment.start, fragment.end, local);
        fragment.mesh.quaternion.copy(fragment.startQuat).slerp(fragment.endQuat, local);
        fragment.mesh.scale.setScalar(fragment.size * (0.18 + reveal * 0.82));
      }

      const dustPhase = smoothstep((amount - 0.1) / 0.42);
      const dustFade = 1 - smoothstep((amount - 0.62) / 0.34);
      dustMaterial.opacity = dustPhase * dustFade * 0.5;
      dustMaterial.size = 0.08 + dustPhase * 0.12;
      for (let i = 0; i < DUST_COUNT; i += 1) {
        const seed = dustSeeds[i];
        const travel = dustPhase * seed.speed;
        dustPositions[i * 3] = Math.cos(seed.angle) * seed.radius * travel;
        dustPositions[i * 3 + 1] = seed.height * Math.sin(Math.min(1, travel) * Math.PI) + 0.08;
        dustPositions[i * 3 + 2] = Math.sin(seed.angle) * seed.radius * travel;
      }
      dustGeometry.attributes.position.needsUpdate = true;

      const ringPhase = smoothstep((amount - 0.1) / 0.3);
      impactRing.scale.setScalar(1 + ringPhase * 8);
      impactRing.material.opacity = (1 - ringPhase) * reveal * 0.42;
      updateHud();
    }

    function animateTo(next) {
      const target = next ? 1 : 0;
      if (!busy && Math.abs(amount - target) < 0.001) return;
      fromAmount = amount;
      targetAmount = target;
      elapsed = 0;
      duration = target > fromAmount ? GRIND_DURATION : RESTORE_DURATION;
      busy = true;
      updateHud();
    }

    grindBtn.addEventListener("click", () => animateTo(1));
    restoreBtn.addEventListener("click", () => animateTo(0));
    cycleBtn.addEventListener("click", () => {
      autoCycle = !autoCycle;
      autoPause = 0;
      updateHud();
    });
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        animateTo(1);
      }
      if (event.key.toLowerCase() === "r") animateTo(0);
    });
    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (busy) {
        elapsed += dt;
        const progress = clamp01(elapsed / duration);
        const eased = targetAmount > fromAmount ? easeOutCubic(progress) : easeInOutCubic(progress);
        amount = THREE.MathUtils.lerp(fromAmount, targetAmount, eased);
        if (progress >= 1) {
          amount = targetAmount;
          busy = false;
          autoPause = 0;
        }
        applyPose();
      } else if (autoCycle) {
        autoPause += dt;
        if (autoPause > 1.1) animateTo(amount < 0.5 ? 1 : 0);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    applyPose();
    renderer.setAnimationLoop(frame);
  </script>
</body>
</html>
